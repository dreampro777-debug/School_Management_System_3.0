{% extends 'base.html' %}

{% block title %}{% if mode == 'update' %}Update Course{% else %}Create Course{% endif %}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card glass-card border-0 p-4">
        <h3 class="fw-bold mb-4">{% if mode == 'update' %}Update Course{% else %}Create Course{% endif %}</h3>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Course Title</label>
            <input type="text" class="form-control" name="title" value="{{ course.title|default:'' }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="4">{{ course.description|default:'' }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'course_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
