{% extends 'base.html' %}

{% block title %}Grade Submission{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card glass-card border-0 p-4">
        <h3 class="fw-bold mb-3">Grade Submission</h3>
        <p class="text-muted mb-4">{{ submission.student.get_full_name|default:submission.student.username }} • {{ submission.assignment.title }}</p>

        <div class="card bg-light border-0 p-3 mb-4">
          <p class="mb-0">{{ submission.content }}</p>
        </div>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Grade</label>
            <input type="number" min="1" max="100" class="form-control" name="grade" value="{{ submission.grade|default:'' }}" placeholder="1-100" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Feedback</label>
            <textarea class="form-control" name="feedback" rows="4">{{ submission.feedback|default:'' }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-task">Save grade</button>
            <a href="{% url 'review_submissions' %}" class="btn-back">Submissions</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
