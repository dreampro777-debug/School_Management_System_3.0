{% extends 'base.html' %}

{% block title %}{% if mode == 'update' %}Update Assignment{% else %}Create Assignment{% endif %}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card glass-card border-0 p-4">
        <h3 class="fw-bold mb-4">{% if mode == 'update' %}Update Assignment{% else %}Create Assignment{% endif %}</h3>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Assignment Title</label>
            <input type="text" class="form-control" name="title" value="{{ assignment.title|default:'' }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Course</label>
            <select class="form-select" name="course" required>
              {% for course in courses %}
                <option value="{{ course.id }}" {% if assignment and assignment.course.id == course.id %}selected{% endif %}>{{ course.title }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Due Date</label>
            <input type="datetime-local" class="form-control" name="due_date" value="{% if assignment %}{{ assignment.due_date|date:'Y-m-d\TH:i' }}{% endif %}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="4">{{ assignment.description|default:'' }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'assignment_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
