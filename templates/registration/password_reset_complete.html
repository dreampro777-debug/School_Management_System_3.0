{% extends 'base.html' %}

{% block title %}Password updated{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card glass-card border-0 p-4 text-center shadow-sm animate__animated animate__fadeInUp">
          <h2 class="fw-bold mb-3">Password updated</h2>
          <p class="text-secondary mb-4">Your password has been reset successfully.</p>
          <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-4">Login now</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
