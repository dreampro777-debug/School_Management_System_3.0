{% extends 'base.html' %}

{% block title %}Set new password{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card glass-card border-0 p-4 shadow-sm animate__animated animate__fadeInUp">
          <h2 class="fw-bold mb-3 text-center">Set a new password</h2>
          <form method="post">
            {% csrf_token %}
            {% for field in form %}
              <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label fw-semibold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                  <div class="text-danger small mt-1">{{ field.errors }}</div>
                {% endif %}
              </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill">Update password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .glass-card {
    border-radius: 24px;
  }
  form input {
    width: 100%;
    height: 52px;
    border-radius: 14px !important;
    border: 1px solid #dfe7f5 !important;
    background: #f8fbff !important;
    padding-left: 16px !important;
  }
</style>
{% endblock %}
