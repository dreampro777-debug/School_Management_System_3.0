{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card glass-card border-0 p-4 shadow-sm animate__animated animate__fadeInUp">
          <h2 class="fw-bold mb-3 text-center">Reset your password</h2>
          <p class="text-secondary text-center mb-4">Enter your email address below and we will send a reset link.</p>

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_email" class="form-label fw-semibold">Email</label>
              {{ form.email }}
              {% if form.email.errors %}
                <div class="text-danger small mt-1">{{ form.email.errors }}</div>
              {% endif %}
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill">Send reset link</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .glass-card {
    border-radius: 24px;
  }
  form input {
    width: 100%;
    height: 52px;
    border-radius: 14px !important;
    border: 1px solid #dfe7f5 !important;
    background: #f8fbff !important;
    padding-left: 16px !important;
  }
</style>
{% endblock %}
